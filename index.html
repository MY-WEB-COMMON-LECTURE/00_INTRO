<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe</title>
    <style>
      html,
      body {
        margin: 0px;
        padding: 0px;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #background-iframe {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 1;
      }
      #earth-iframe {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 400px;
        border: none;
        z-index: 1000;
        border-radius: 50%;
      }
      .my_profile {
        position: fixed;
        right : 0;
        bottom: 0;
        top:0;
        margin:auto;
        background-color: transparent;
        border-left : 2px solid white;
        width: 500px;
        height: 100vh;
        z-index: 2000;
      }
      .my_profile h1{
        position: relative;
        z-index: 2000;
        color:white;
      }
    </style>
</head>
<body>
    <iframe id="background-iframe" src="02/index.html"></iframe>
    <iframe id="earth-iframe" src="01/index.html"></iframe>
    <div class="my_profile">
        <div class="header">
         
        </div>
    </div>
</body>
</html>
